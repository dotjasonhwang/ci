name: Link check

# Called by each site's .github/workflows/ci.yml on push, PRs, the monthly schedule and manual runs.
on:
  workflow_call:
    inputs:
      package-manager:
        description: 'pnpm or npm'
        type: string
        default: pnpm
      extra-args:
        description: 'Extra lychee arguments, one per line (e.g. --exclude some-domain.com)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  link-check:
    name: Check links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      # Shared with the pre-push hook, so the site must have @dotjasonhwang/ci as a devDependency
      - name: Check for the shared lychee config
        run: |
          test -f node_modules/@dotjasonhwang/ci/lychee.toml || {
            echo "::error::node_modules/@dotjasonhwang/ci/lychee.toml not found. Add @dotjasonhwang/ci as a devDependency."
            exit 1
          }

      - name: Build site
        run: ${{ inputs.package-manager }} run build

      # The site's own domain (from the built sitemap) is skipped: its pages are checked as
      # files in dist/, and production doesn't have a page this push adds until Netlify deploys it.
      # No sitemap means no exclude.
      - name: Find the site's own domain
        id: site
        run: |
          host=$(grep -ho '<loc>[^<]*' dist/sitemap-index.xml dist/sitemap.xml 2>/dev/null | head -1 \
            | sed -E 's#^<loc>https?://(www\.)?([^/]+).*#\2#; s/\./\\./g' || true)
          echo "Own domain: ${host:-none found}"
          echo "host-re=$host" >> "$GITHUB_OUTPUT"

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Every link in the built site: internal ones resolve against dist/ (like the pre-push hook),
          # external ones are fetched. Excludes, timeouts and retries are in the shared lychee.toml.
          args: |
            --verbose
            --config node_modules/@dotjasonhwang/ci/lychee.toml
            --root-dir ${{ github.workspace }}/dist
            ${{ steps.site.outputs.host-re && format('--exclude ''^https?://(www\.)?{0}(/|$)''', steps.site.outputs.host-re) || '' }}
            ${{ inputs.extra-args }}
            dist
          fail: true
          jobSummary: true
